# Logrotate Configuration untuk Agenda Online PTPN
#
# [FIX LOG BLOATING] File log tambahan yang di-appendOutputTo oleh Laravel Scheduler
# tidak dikelola oleh LOG_CHANNEL=daily, sehingga perlu dirotasi manual.
#
# INSTALASI di server:
#   sudo cp logrotate-laravel.conf /etc/logrotate.d/agenda-online-ptpn
#   sudo logrotate -d /etc/logrotate.d/agenda-online-ptpn  # test dulu (dry-run)
#   sudo logrotate -f /etc/logrotate.d/agenda-online-ptpn  # jalankan pertama kali

/var/www/agenda_online_ptpn/storage/logs/auto-forward-dokumen.log
/var/www/agenda_online_ptpn/storage/logs/sync-cashbank.log
/var/www/agenda_online_ptpn/storage/logs/late-document-notifications.log
{
    su www-data www-data
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    create 0664 www-data www-data
    copytruncate
}
